{% load static %}

{% block title %}
<title>Login</title>
{% endblock %}

{% block link %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<div class="login-box">
  <h2>Login</h2>
  <form method="POST">
    {% csrf_token %}
    <div class="user-box">
      <input type="text" name="username" required="">
      <label>Username</label>
    </div>
    <div class="user-box">
      <input type="password" name="password" required="">
      <label>Password</label>
    </div>
    <input type="submit">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      Login
    </input>
  </form>
</div>
{% endblock %}
